name: Build & Release

on:
  push:
    branches: [wyerdev/afw-joeyhodge]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  # Which build this workflow releases. VARIANT_ID must match UEVR_VARIANT_ID
  # in include/uevr/Variant.hpp and the BUILD_LINES table in
  # scripts/generate_release_notes.py. Each integration branch changes these
  # five values and nothing else, so its releases get their own tag names and
  # zip names and never mix with the main build's. Only the main build sets
  # IS_LATEST to true — GitHub only has one "Latest" badge for the whole repo.
  #
  # The line's filter on the releases page is its opaque "marker" token, set
  # in BUILD_LINES in scripts/generate_release_notes.py and printed once at the
  # bottom of every release body — /releases?q=buildline3afwjoeyhodge. Not
  # TAG_PREFIX, and not a natural word. GitHub ANDs every word of the query
  # against each release's title and body and highlights each match, so the
  # full prefix highlights "uevr", "reshade" and "release" all over every card,
  # and a word like "afw" also matches the plain AFW line. 
  # scripts/generate_release_notes.py documents the marker rules
  # and fails the build if a body breaks them.
  VARIANT_ID: reshade-afw-joeyhodge
  LINE_NAME: UEVR ReShade AFW + Joeyhodge
  # LINE_FILE_ID must carry "ReShade" on every line. It is the only part of the
  # asset filename a user sees once the zip is downloaded, and a bare "AFW" zip
  # is indistinguishable from PureDark's own AFW release.
  LINE_FILE_ID: ReShade-AFW-Joeyhodge
  TAG_PREFIX: uevr-reshade-afw-joeyhodge-release
  IS_LATEST: false

permissions:
  contents: write

jobs:
  build-and-release:
    # Escape hatch: put "(skip)" in the commit message to push without cutting
    # a release. For docs, plan notes, or a fix you intend to squash into the
    # next real release. Matches anywhere in the message, not just the subject
    # line — GitHub's expression syntax cannot split it. A manual
    # workflow_dispatch has no head commit and therefore always runs, which is
    # also how you release a "(skip)" commit after the fact.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '(skip)')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{secrets.UESDK_PAT}}
          submodules: recursive
          fetch-depth: 0

      - name: Read base nightly tag
        run: |
          $tag = (Get-Content "${{github.workspace}}/BASE_NIGHTLY" -Raw).Trim()
          echo "NIGHTLY_TAG=$tag" >> $env:GITHUB_ENV
          # praydog nightlies look like nightly-01132-<sha>; PureDark's AFW
          # releases look like UEVR_AFW_v1.0-beta.5. Without the second pattern
          # the AFW line would tag every release "00000-<run>".
          if ($tag -match "nightly-(\d+)-") {
            $num = $Matches[1]
          } elseif ($tag -match "beta\.(\d+)") {
            $num = "beta$($Matches[1])"
          } else {
            $num = "00000"
          }
          echo "NIGHTLY_NUM=$num" >> $env:GITHUB_ENV
          $build = "$num-${{github.run_number}}"
          echo "BUILD_ID=$build" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=${{env.TAG_PREFIX}}-$build" >> $env:GITHUB_ENV
          echo "SHADER_PLUGINS_ZIP_NAME=UEVR-${{env.LINE_FILE_ID}}-$build-ShaderPlugins" >> $env:GITHUB_ENV
        shell: powershell

      - name: Create annotated tag locally
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "${{env.RELEASE_TAG}}" -m "${{env.LINE_NAME}} | ${{env.BUILD_ID}}"
        shell: bash

      - name: Build
        run: call build.bat
        shell: cmd
        env:
          # build.bat defaults to a local out-of-source dir (A:\UEVR-build\...)
          # which does not exist on the runner. Point it at the in-tree build\
          # dir that the artifact steps below glob.
          UEVR_BUILD_DIR: ${{github.workspace}}\build

      - name: Resolve latest master shader release
        run: |
          $releaseJson = gh release list `
            --repo "${{github.repository}}" `
            --limit 100 `
            --exclude-drafts `
            --exclude-pre-releases `
            --json tagName,isLatest,publishedAt
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list releases to resolve the latest master shader package."
          }
          $parsedReleases = ConvertFrom-Json -InputObject $releaseJson
          $releases = @(foreach ($release in $parsedReleases) { $release })
          $masterReleases = @($releases | Where-Object {
            $_.isLatest -eq $true -and
            $_.tagName -like "uevr-reshade-mainline-release-*"
          })
          if ($masterReleases.Count -ne 1) {
            throw "Expected exactly one latest mainline release, found $($masterReleases.Count)."
          }
          echo "MASTER_SHADER_RELEASE_TAG=$($masterReleases[0].tagName)" >> $env:GITHUB_ENV
          Write-Host "Using latest master shader release $($masterReleases[0].tagName)"
        shell: powershell
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Download latest master shader package
        run: |
          $downloadDir = "${{github.workspace}}\master-shader-source"
          New-Item -ItemType Directory -Path "$downloadDir" -Force | Out-Null
          gh release download "$env:MASTER_SHADER_RELEASE_TAG" `
            --repo "${{github.repository}}" `
            --pattern "*-ShaderPlugins.zip" `
            --dir "$downloadDir" `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the canonical master shader package."
          }
          $packages = @(Get-ChildItem "$downloadDir\*-ShaderPlugins.zip" -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one master ShaderPlugins zip, found $($packages.Count)."
          }
          echo "MASTER_SHADER_PACKAGE=$($packages[0].FullName)" >> $env:GITHUB_ENV
        shell: powershell
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Generate shader package readme
        run: |
          python "${{github.workspace}}/scripts/generate_release_notes.py" `
            --nightly-tag "${{env.NIGHTLY_TAG}}" `
            --shader-plugins-name "${{env.SHADER_PLUGINS_ZIP_NAME}}" `
            --repo-slug "${{github.repository}}" `
            --commit-sha "${{github.sha}}" `
            --variant "${{env.VARIANT_ID}}" `
            --install-readme-out-file "${{github.workspace}}/README-Install.txt"
        shell: powershell

      - name: Package shader plugins zip
        run: |
          $staging = "${{github.workspace}}/shader-plugins-staging"
          New-Item -ItemType Directory -Path "$staging" -Force | Out-Null
          New-Item -ItemType Directory -Path "$staging/plugins/shaders" -Force | Out-Null
          New-Item -ItemType Directory -Path "$staging/shipping_presets" -Force | Out-Null
          New-Item -ItemType Directory -Path "$staging/shader_assets" -Force | Out-Null

          $masterExtract = "${{github.workspace}}\master-shader-extracted"
          Remove-Item "$masterExtract" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$masterExtract" -Force | Out-Null
          7z x "$env:MASTER_SHADER_PACKAGE" "-o$masterExtract" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Could not extract the canonical master shader package."
          }

          # Copy only the shared payload from the canonical master package.
          foreach ($sharedPath in @('plugins/shaders', 'shipping_presets', 'shader_assets')) {
            $sourcePath = Join-Path $masterExtract $sharedPath
            if (!(Test-Path $sourcePath)) {
              throw "Master shader package is missing $sharedPath."
            }
            $destinationPath = Join-Path $staging $sharedPath
            Copy-Item "$sourcePath\*" "$destinationPath\" -Recurse -Force
          }

          # Add the branch-specific backend files to the shader package.
          Copy-Item "${{github.workspace}}/build/bin/uevr/*" "$staging/" -Recurse -Force
          Copy-Item "${{github.workspace}}/build/bin/vr-plugin-nullifier/UEVRPluginNullifier.dll" "$staging/"
          Copy-Item "${{github.workspace}}/build/bin/LuaVR/LuaVR.dll" "$staging/"
          # The build's PDAFWPlugin.dll is only a dummy used to satisfy the
          # delay-load link. Never package it: the real proprietary DLL must
          # remain from PureDark's original AFW release.
          if (Test-Path "$staging/PDAFWPlugin.dll") {
            throw "The proprietary PDAFWPlugin.dll must remain from PureDark's base release."
          }
          echo ${{github.sha}} > ${{github.workspace}}/revision.txt
          Copy-Item "${{github.workspace}}/revision.txt" "$staging/"

          # Hash the shared shader files before creating this branch package.
          $shaderFiles = @(Get-ChildItem "$staging/plugins/shaders/*Shader.dll" -File)
          if ($shaderFiles.Count -eq 0) {
            throw "The master shader package contains no shader DLLs."
          }
          $shaderFiles | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path)" }

          # Copy install/uninstall scripts
          Copy-Item "${{github.workspace}}/install-plugins.bat" "$staging/"
          Copy-Item "${{github.workspace}}/uninstall-plugins.bat" "$staging/"
          Copy-Item "${{github.workspace}}/README-Install.txt" "$staging/"

          # Create zip
          7z a "${{github.workspace}}/${{env.SHADER_PLUGINS_ZIP_NAME}}.zip" "$staging/*"
        shell: powershell

      - name: Hash shader plugins zip
        run: |
          $package = "${{github.workspace}}/${{env.SHADER_PLUGINS_ZIP_NAME}}.zip"
          $hash = Get-FileHash -Algorithm SHA256 $package
          $hash.Hash | Out-File -FilePath "$package.sha256"
        shell: powershell

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/PureDark/UEVR.git
          git fetch upstream Joey-Merged --no-tags
          echo "UPSTREAM_SHA=$(git rev-parse upstream/Joey-Merged)" >> "$GITHUB_ENV"
        shell: bash

      - name: Generate release notes
        run: |
          python "${{github.workspace}}/scripts/generate_release_notes.py" `
            --nightly-tag "${{env.NIGHTLY_TAG}}" `
            --shader-plugins-name "${{env.SHADER_PLUGINS_ZIP_NAME}}" `
            --repo-slug "${{github.repository}}" `
            --commit-sha "${{github.sha}}" `
            --variant "${{env.VARIANT_ID}}" `
            --upstream-commit "${{env.UPSTREAM_SHA}}" `
            --out-file "${{github.workspace}}/RELEASE_NOTES.md"
        shell: powershell

      - name: Push annotated tag
        run: |
          git push origin "${{env.RELEASE_TAG}}"
        shell: bash

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{env.RELEASE_TAG}}
          name: "${{env.LINE_NAME}} | ${{env.BUILD_ID}}"
          artifacts: "${{github.workspace}}/${{env.SHADER_PLUGINS_ZIP_NAME}}.zip,${{github.workspace}}/${{env.SHADER_PLUGINS_ZIP_NAME}}.zip.sha256"
          bodyFile: ${{github.workspace}}/RELEASE_NOTES.md
          # Only the main build gets GitHub's "Latest" badge. The other builds
          # publish as normal releases so they never take it over.
          makeLatest: ${{env.IS_LATEST}}
          token: ${{secrets.GITHUB_TOKEN}}

